name: ios-sdk-ci
on:
  push:
  pull_request:
jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on an available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available | sed -n 's/.*iPhone.*(\([A-F0-9-]\{36\}\)).*/\1/p' | head -1)
          test -n "$udid"
          xcodebuild test -scheme PushPlatformSDK -destination "id=$udid" CODE_SIGNING_ALLOWED=NO
