name: ios-sdk-ci
on:
  push:
  pull_request:
jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on an available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available | sed -n 's/.*iPhone.*(\([A-F0-9-]\{36\}\)).*/\1/p' | head -1)
          test -n "$udid"
          # After App/Extension product split, only the Package scheme exposes the test action.
          xcodebuild test -scheme PushPlatformSDK-Package -destination "id=$udid" CODE_SIGNING_ALLOWED=NO
      - name: Build extension-safe target with APPLICATION_EXTENSION_API_ONLY
        run: |
          xcodebuild build \
            -scheme PushPlatformExtension \
            -destination 'generic/platform=iOS Simulator' \
            APPLICATION_EXTENSION_API_ONLY=YES \
            CODE_SIGNING_ALLOWED=NO
